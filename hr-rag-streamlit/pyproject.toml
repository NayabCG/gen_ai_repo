[project]
name = "hr-rag-streamlit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "santuparsi", email = "santuparsi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
hr-rag-streamlit = "hr_rag_streamlit:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
